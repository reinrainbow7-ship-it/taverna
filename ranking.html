<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8522a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Taverna" />
  <title>Taverna ランキング</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--sub); font-size: 14px;
      padding: 6px 0; transition: color .15s;
    }
    .back-btn:hover { color: var(--accent); }
    .rank-title { font-size: 20px; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <div class="logo">Taverna <span>ランキング</span></div>
  <button class="btn-ghost" onclick="logout()" style="font-size:13px;">ログアウト</button>
</header>

<!-- メインコンテンツ -->
<main>
  <button class="back-btn" onclick="location.href='index.html'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    お店一覧へ戻る
  </button>
  <h1 class="rank-title">🏆 ランキング</h1>

  <!-- タブ -->
  <div class="rank-tabs">
    <button class="rank-tab active" data-tab="rating" onclick="switchRankTab('rating')">⭐ 評価順</button>
    <button class="rank-tab" data-tab="visits" onclick="switchRankTab('visits')">🍽 訪問回数順</button>
    <button class="rank-tab" data-tab="menu-rec" onclick="switchRankTab('menu-rec')">🍴 おすすめメニュー</button>
    <button class="rank-tab" data-tab="menu-orders" onclick="switchRankTab('menu-orders')">🔁 よく頼むメニュー</button>
    <button class="rank-tab" data-tab="mybest" onclick="switchRankTab('mybest')">👑 マイベスト</button>
  </div>
  <p class="rank-note" id="rank-note"></p>

  <!-- ランキング一覧 -->
  <div id="rank-list"></div>

  <!-- マイベストへの追加（デモモードでは非表示） -->
  <div class="mybest-controls" id="mybest-controls" style="display:none;">
    <label>お店を追加</label>
    <div class="mybest-add-row">
      <select id="mybest-select"></select>
      <button class="btn-primary" id="mybest-add-btn" onclick="addToMyBest()">追加</button>
    </div>
  </div>
</main>

<!-- トースト通知 -->
<div class="toast" id="toast"></div>

<!-- スクリプト（依存順に読み込む） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js"></script>
<script src="js/pwa.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/stores.js"></script>
<script src="js/ranking.js"></script>
<script>
  // ─── 初期化 ───
  checkAuth().then(initRanking);
</script>

</body>
</html>
