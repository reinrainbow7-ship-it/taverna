<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taverna テスト</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    .summary { font-size: 16px; font-weight: 700; padding: 12px 16px; border-radius: 8px; margin: 12px 0 20px; }
    .summary.ok { background: #e8f6ee; color: #1e8449; }
    .summary.ng { background: #fbeae8; color: #b03a2e; }
    .suite { margin-bottom: 18px; }
    .suite-title { font-weight: 700; font-size: 14px; margin: 14px 0 6px; color: #555; }
    .case { font-size: 13px; padding: 4px 8px; border-radius: 6px; display: flex; gap: 8px; }
    .case.pass { color: #1e8449; }
    .case.fail { color: #b03a2e; background: #fdeaea; }
    .case .mark { width: 16px; flex-shrink: 0; }
    .case .err { color: #b03a2e; font-family: monospace; font-size: 12px; }
    .note { font-size: 12px; color: #888; margin-top: 24px; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>Taverna 自動テスト（純粋ロジック）</h1>
  <div id="summary" class="summary">実行中…</div>
  <div id="results"></div>
  <div class="note">
    ここで確認できるのは DOM・Supabase・地図に依存しない純粋ロジックのみです。<br>
    画面操作・地図ピン・ページ遷移・実データ書き込みなどは <strong>TESTING.md の手動チェックリスト</strong>（将来は Playwright）で確認します。<br>
    実行方法：このファイルをブラウザで開くだけ（Live Server 不要・オフライン可）。
  </div>

  <!-- showToast が呼ばれても落ちないようダミーを置く -->
  <div id="toast" style="display:none;"></div>

  <!-- テスト対象（DOM/Supabase/Leaflet に触れない純粋関数を持つものだけ）-->
  <script src="js/utils.js"></script>
  <script src="js/seating.js"></script>
  <script src="js/parking.js"></script>
  <script src="js/winter.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/bulk.js"></script>
  <script src="js/export.js"></script>
  <script src="js/stores.js"></script>
  <script src="js/ranking.js"></script>
  <!-- sw.js は振り分け判定（routeFor）だけをテストする。イベント登録は window 上では発火しない -->
  <script src="sw.js"></script>

  <script>
    // ─── 極小テストランナー ───
    const T = [];
    function test(suite, name, fn) { T.push({ suite, name, fn }); }
    function assert(cond, msg) { if (!cond) throw new Error(msg || 'assert failed'); }
    function eq(a, b, msg) {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error((msg ? msg + ' / ' : '') + `expected ${B}, got ${A}`);
    }
    function has(str, sub, msg) {
      if (String(str).indexOf(sub) < 0) throw new Error((msg ? msg + ' / ' : '') + `"${sub}" not found in "${str}"`);
    }

    // ─── esc ───
    test('esc', '特殊文字をエスケープ', () => eq(esc('<b>&"'), '&lt;b&gt;&amp;&quot;'));
    test('esc', 'null は空文字', () => eq(esc(null), ''));
    test('esc', '数値は文字列化', () => eq(esc(123), '123'));
    test('esc', "シングルクォートは現状エスケープしない（既知）", () => eq(esc("a'b"), "a'b"));

    // ─── safeUrl ───
    test('safeUrl', 'https は通す', () => eq(safeUrl('https://x.com'), 'https://x.com'));
    test('safeUrl', 'javascript: は弾く', () => eq(safeUrl('javascript:alert(1)'), ''));
    test('safeUrl', '前後空白を除去', () => eq(safeUrl('  http://a.b '), 'http://a.b'));
    test('safeUrl', '空・null は空文字', () => { eq(safeUrl(''), ''); eq(safeUrl(null), ''); });

    // ─── genId ───
    test('genId', '英数字のみ', () => assert(/^[a-z0-9]+$/.test(genId())));
    test('genId', '毎回異なる', () => assert(genId() !== genId()));

    // ─── fileExt ───
    test('fileExt', '拡張子を小文字で取得', () => eq(fileExt({ name: 'a.JPG' }), 'jpg'));
    test('fileExt', '拡張子なしは MIME から推定', () => eq(fileExt({ name: 'a', type: 'image/png' }), 'png'));
    test('fileExt', '不明なら jpg', () => eq(fileExt({ name: 'a' }), 'jpg'));
    test('fileExt', '複数ドットは末尾', () => eq(fileExt({ name: 'a.b.webp' }), 'webp'));

    // ─── bulk: parseBulkText ───
    test('bulk', '基本1行', () => {
      const r = parseBulkText('みせ,函館');
      eq(r.length, 1); eq(r[0].name, 'みせ'); eq(r[0].area, '函館'); eq(r[0].errors, []);
    });
    test('bulk', '見出し行をスキップ', () => {
      const r = parseBulkText('店名,エリア\nみせ,函館');
      eq(r.length, 1); eq(r[0].name, 'みせ');
    });
    test('bulk', 'タグはセミコロン分割', () => {
      const r = parseBulkText('みせ,函館,あり,ラーメン;塩,,');
      eq(r[0].parking, 'あり'); eq(r[0].tags, ['ラーメン', '塩']);
    });
    test('bulk', '不正な駐車場は空に正規化', () => {
      eq(parseBulkText('みせ,函館,てきとう')[0].parking, '');
    });
    test('bulk', '引用符内のカンマを保持', () => {
      eq(parseBulkText('みせ,函館,,,,"a,b"')[0].memo, 'a,b');
    });
    test('bulk', '店名が空はエラー', () => {
      assert(parseBulkText(',函館')[0].errors.includes('店名が空'));
    });
    test('bulk', 'エリアが空はエラー', () => {
      assert(parseBulkText('みせ')[0].errors.includes('エリアが空'));
    });

    test('bulk', '引用符内の改行は1つの値として保持', () => {
      const r = parseBulkText('みせ,函館,,,,"1行目\n2行目"\nべつ,元町');
      eq(r.length, 2); eq(r[0].memo, '1行目\n2行目'); eq(r[1].name, 'べつ');
    });
    test('bulk', 'CRLF・空行・先頭BOMを許容', () => {
      const r = parseBulkText('﻿店名,エリア\r\n\r\nみせ,函館\r\n');
      eq(r.length, 1); eq(r[0].name, 'みせ'); eq(r[0].area, '函館');
    });
    test('bulk', '"" は引用符1文字', () => {
      eq(parseBulkText('みせ,函館,,,,"彼は ""うまい"" と言った"')[0].memo, '彼は "うまい" と言った');
    });

    // ─── export: CSV生成 ───
    test('export', '普通の値はそのまま・null は空', () => {
      eq(csvCell('abc'), 'abc'); eq(csvCell(null), ''); eq(csvCell(undefined), ''); eq(csvCell(0), '0');
    });
    test('export', 'カンマ・引用符・改行を含む値は囲む', () => {
      eq(csvCell('a,b'), '"a,b"'); eq(csvCell('a"b'), '"a""b"'); eq(csvCell('a\nb'), '"a\nb"');
    });
    test('export', '行は CRLF 区切り・見出しが先頭', () => {
      eq(toCsv(['x', 'y'], [[1, 2], [3, null]]), 'x,y\r\n1,2\r\n3,');
    });
    test('export', 'ファイル名は種類と日付', () => {
      eq(exportFileName('stores', new Date(2026, 0, 5)), 'taverna-stores-2026-01-05.csv');
    });
    const ES = [{
      id: 's1', name: 'ラーメン "函館"', area: '五稜郭', parking: 'あり', tags: ['ラーメン', '塩'],
      sns: 'https://x.com/a', memo: '濃厚、また行きたい\n次は味噌',
      seat_counter: true, seat_counter_num: 4, seat_table: true, seat_table_num: null, smoking: 'sep',
    }, { id: 's2', name: 'カフェ', area: '元町', parking: null, tags: null, sns: null, memo: null }];
    test('export', 'お店CSVの先頭6列は一括登録と同じ並び', () => {
      eq(storesToCsv([]).split(',').slice(0, 6), ['店名', 'エリア', '駐車場', 'タグ', 'SNS', 'メモ']);
    });
    test('export', '席は席数優先・ありのみは「あり」・喫煙はラベル', () => {
      const cols = _parseCsvRows(storesToCsv(ES))[1];
      eq(cols.slice(15, 20), ['4', 'あり', '', '', '分煙']);
    });
    test('export', 'お店CSVを一括登録で読み戻すと同じ内容になる（往復）', () => {
      const r = parseBulkText(storesToCsv(ES));
      eq(r.length, 2);
      eq(r[0], { name: 'ラーメン "函館"', area: '五稜郭', parking: 'あり', tags: ['ラーメン', '塩'],
                 sns: 'https://x.com/a', memo: '濃厚、また行きたい\n次は味噌', errors: [] });
      eq(r[1], { name: 'カフェ', area: '元町', parking: '', tags: [], sns: '', memo: '', errors: [] });
    });
    test('export', '訪問ログCSVは店名を引いて出す', () => {
      const rows = _parseCsvRows(visitsToCsv([{ id: 'v1', store_id: 's2', date: '2026-07-01', rating: 5, memo: 'うまい' }], ES));
      eq(rows[0].slice(0, 4), ['店名', '来店日', '評価', 'メモ']);
      eq(rows[1].slice(0, 4), ['カフェ', '2026-07-01', '5', 'うまい']);
    });
    test('export', 'メニューCSVは価格0を空にしない', () => {
      const rows = _parseCsvRows(menusToCsv([{ id: 'm1', store_id: 's2', name: '水', price: 0, recommend_rating: 3, order_count: 2 }], ES));
      eq(rows[1].slice(0, 5), ['カフェ', '水', '0', '3', '2']);
    });

    // ─── seating: renderSeatingBadges ───
    test('seating', '情報なしは空文字（card）', () => eq(renderSeatingBadges({}, 'card'), ''));
    test('seating', 'カウンターで ひとり◎（card）', () => has(renderSeatingBadges({ seat_counter: true }, 'card'), 'ひとり◎'));
    test('seating', '座敷で 子連れ◎（card）', () => has(renderSeatingBadges({ seat_zashiki: true }, 'card'), '子連れ◎'));
    test('seating', '禁煙バッジ（card）', () => has(renderSeatingBadges({ smoking: 'no' }, 'card'), '禁煙'));
    test('seating', '情報なしは空文字（detail）', () => eq(renderSeatingBadges({}, 'detail'), ''));
    test('seating', 'テーブル席バッジ（detail）', () => has(renderSeatingBadges({ seat_table: true }, 'detail'), 'テーブル'));
    test('seating', '喫煙可バッジ（detail）', () => has(renderSeatingBadges({ smoking: 'yes' }, 'detail'), '喫煙可'));
    test('seating', '席メモはエスケープされる', () => has(renderSeatingBadges({ seat_note: '<x>' }, 'detail'), '&lt;x&gt;'));
    test('seating', '席数を表示（detail）', () => has(renderSeatingBadges({ seat_counter: true, seat_counter_num: 4 }, 'detail'), '4席'));
    test('seating', '未選択なら席数は出さない（detail）', () => eq(renderSeatingBadges({ seat_counter_num: 4 }, 'detail'), ''));

    // ─── parking: renderParkingDetail ───
    test('parking', '情報なしは空文字', () => eq(renderParkingDetail({}), ''));
    test('parking', '台数を表示', () => has(renderParkingDetail({ parking_capacity: 5 }), '約5台'));
    test('parking', '余裕（緑）ラベル', () => has(renderParkingDetail({ parking_kei: 3 }), '余裕'));
    test('parking', '軽のラベル', () => has(renderParkingDetail({ parking_kei: 3 }), '軽'));
    test('parking', '厳しいラベル', () => has(renderParkingDetail({ parking_futsuu: 1 }), '厳しい'));
    test('parking', '駐車場メモを表示', () => has(renderParkingDetail({ parking_note: '狭い' }), '狭い'));

    // ─── winter: 冬モード ───
    test('winter', '12〜3月は冬季・それ以外は冬季でない', () => {
      [[11, true], [0, true], [1, true], [2, true]].forEach(([m, w]) => eq(isWinterSeason(new Date(2026, m, 15)), w));
      [3, 6, 10].forEach(m => eq(isWinterSeason(new Date(2026, m, 15)), false));
    });
    test('winter', '季節の境目（11/30は冬季でない・12/1から・3/31まで・4/1は冬季でない）', () => {
      eq(isWinterSeason(new Date(2026, 10, 30)), false); eq(isWinterSeason(new Date(2026, 11, 1)), true);
      eq(isWinterSeason(new Date(2027, 2, 31)), true);   eq(isWinterSeason(new Date(2027, 3, 1)), false);
    });
    test('winter', '?winter=1 / ?winter=0 で季節を上書きできる', () => {
      const july = new Date(2026, 6, 1), jan = new Date(2026, 0, 10);
      eq(winterModeActive('?winter=1', july), true);  eq(winterModeActive('?a=b&winter=0', jan), false);
      eq(winterModeActive('', july), false);          eq(winterModeActive('?winter=9', jan), true);
    });
    test('winter', '冬でも行きやすい＝冬の駐車が問題なし かつ 坂道の印なし', () => {
      eq(isWinterEasy({ winter_parking: 3 }), true);
      eq(isWinterEasy({ winter_parking: 3, slope: true }), false);
      eq(isWinterEasy({ winter_parking: 2 }), false);
      eq(isWinterEasy({}), false, '未評価は含めない');
    });
    test('winter', 'バッジ：情報なしは空文字', () => {
      eq(renderWinterBadges({}, 'card'), ''); eq(renderWinterBadges({ slope: null, winter_parking: null }, 'detail'), '');
    });
    test('winter', 'バッジ：評価ごとのラベルと色', () => {
      has(renderWinterBadges({ winter_parking: 1 }, 'card'), '冬は厳しい'); has(renderWinterBadges({ winter_parking: 1 }, 'card'), 'pk-1');
      has(renderWinterBadges({ winter_parking: 2 }, 'card'), '冬は台数減');
      has(renderWinterBadges({ winter_parking: 3 }, 'detail'), '冬も駐めやすい'); has(renderWinterBadges({ winter_parking: 3 }, 'detail'), 'pk-3');
    });
    test('winter', 'バッジ：坂道は駐車評価がなくても出る', () => {
      has(renderWinterBadges({ slope: true }, 'card'), '坂道あり');
      has(renderWinterBadges({ slope: true }, 'card'), 'winter-card-row');
    });
    test('filter', 'winter: 冬の駐車が問題なしで真・坂道ありは偽', () => {
      assert(cf('winter').test({ winter_parking: 3 }) === true);
      assert(cf('winter').test({ winter_parking: 3, slope: true }) === false);
      assert(cf('winter').test({}) === false);
    });
    test('export', 'お店CSVに冬の駐車と坂道が出る（既存の列位置は変えない）', () => {
      const rows = _parseCsvRows(storesToCsv([{ id: 'w', name: 'a', area: 'b', winter_parking: 2, slope: true, my_rank: 1 }]));
      eq(rows[0].slice(21, 24), ['冬の駐車(1-3)', '坂道', 'マイベスト順位']);
      eq(rows[1].slice(21, 24), ['2', 'あり', '1']);
    });

    // ─── 条件フィルター（CONDITION_FILTERS）───
    const cf = k => CONDITION_FILTERS.find(c => c.key === k);
    test('filter', 'solo: カウンターありで真', () => assert(cf('solo').test({ seat_counter: true }) === true));
    test('filter', 'solo: なしで偽', () => assert(cf('solo').test({ seat_counter: false }) === false));
    test('filter', 'kids: 座敷ありで真', () => assert(cf('kids').test({ seat_zashiki: true }) === true));
    test('filter', 'group: テーブル＋個室で真', () => assert(cf('group').test({ seat_table: true, seat_private: true }) === true));
    test('filter', 'group: 片方だけは偽', () => assert(cf('group').test({ seat_table: true }) === false));
    test('filter', 'nosmoke: 禁煙で真', () => assert(cf('nosmoke').test({ smoking: 'no' }) === true));
    test('filter', 'nosmoke: 喫煙可で偽', () => assert(cf('nosmoke').test({ smoking: 'yes' }) === false));

    // ─── ranking: calcVisitStats ───
    test('ranking', '空なら空オブジェクト', () => eq(calcVisitStats([]), {}));
    test('ranking', '平均は小数1桁に丸める', () => {
      const st = calcVisitStats([
        { store_id: 'a', rating: 4 }, { store_id: 'a', rating: 5 }, { store_id: 'a', rating: 4 }]);
      eq(st.a.count, 3); eq(st.a.avg, 4.3);
    });
    test('ranking', '店ごとに分けて集計', () => {
      const st = calcVisitStats([{ store_id: 'a', rating: 2 }, { store_id: 'b', rating: 5 }]);
      eq(st.a.avg, 2); eq(st.b.avg, 5);
    });

    // ─── ranking: 並べ替え ───
    const RS = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
    test('ranking', '評価の高い順に並ぶ', () => {
      const st = { a: { avg: 3, count: 1 }, b: { avg: 5, count: 1 } };
      eq(rankByRating(RS, st).map(s => s.id), ['b', 'a']);
    });
    test('ranking', '訪問記録のない店は評価順に出ない', () => {
      eq(rankByRating(RS, { a: { avg: 4, count: 1 } }).length, 1);
    });
    test('ranking', '評価同点は訪問回数が多い方が上', () => {
      const st = { a: { avg: 4, count: 1 }, b: { avg: 4, count: 3 } };
      eq(rankByRating(RS, st)[0].id, 'b');
    });
    test('ranking', '訪問回数の多い順に並ぶ', () => {
      const st = { a: { avg: 5, count: 2 }, b: { avg: 3, count: 7 } };
      eq(rankByVisits(RS, st).map(s => s.id), ['b', 'a']);
    });
    test('ranking', 'マイベストは my_rank 昇順・未登録は除外', () => {
      const stores = [{ id: 'a', my_rank: 2 }, { id: 'b', my_rank: 1 }, { id: 'c', my_rank: null }];
      eq(rankByMyRank(stores).map(s => s.id), ['b', 'a']);
    });
    test('ranking', '1〜3位はメダル・4位は数字', () => {
      eq(rankMark(0), '🥇'); eq(rankMark(2), '🥉'); eq(rankMark(3), '4');
    });

    // ─── ranking: メニューランキング ───
    test('ranking', 'メニューはおすすめ度の高い順に並ぶ', () => {
      const ms = [{ id: 'a', recommend_rating: 3 }, { id: 'b', recommend_rating: 5 }];
      eq(rankMenusByRecommend(ms).map(m => m.id), ['b', 'a']);
    });
    test('ranking', 'おすすめ度が未設定(0/null)のメニューは出ない', () => {
      const ms = [{ id: 'a', recommend_rating: 0 }, { id: 'b', recommend_rating: null }, { id: 'c', recommend_rating: 4 }];
      eq(rankMenusByRecommend(ms).map(m => m.id), ['c']);
    });
    test('ranking', 'おすすめ度同点は注文回数が多い方が上', () => {
      const ms = [{ id: 'a', recommend_rating: 4, order_count: null }, { id: 'b', recommend_rating: 4, order_count: 3 }];
      eq(rankMenusByRecommend(ms)[0].id, 'b');
    });
    test('ranking', 'メニューは注文回数の多い順に並ぶ', () => {
      const ms = [{ id: 'a', order_count: 2, recommend_rating: 5 }, { id: 'b', order_count: 7, recommend_rating: 1 }];
      eq(rankMenusByOrders(ms).map(m => m.id), ['b', 'a']);
    });
    test('ranking', '注文回数0/nullのメニューは出ない', () => {
      const ms = [{ id: 'a', order_count: 0 }, { id: 'b', order_count: null }, { id: 'c', order_count: 1 }];
      eq(rankMenusByOrders(ms).map(m => m.id), ['c']);
    });
    test('ranking', '注文回数同点はおすすめ度が高い方が上', () => {
      const ms = [{ id: 'a', order_count: 2, recommend_rating: null }, { id: 'b', order_count: 2, recommend_rating: 4 }];
      eq(rankMenusByOrders(ms)[0].id, 'b');
    });
    test('ranking', 'メニュー並べ替えは空・nullでも落ちない', () => {
      eq(rankMenusByRecommend(null), []); eq(rankMenusByOrders([]), []);
    });

    // ─── sw: リクエストの振り分け ───
    const SWO = 'https://taverna.example';
    test('sw', '自サイトのGETは shell', () => {
      eq(routeFor('GET', SWO + '/store-detail.html?id=abc', SWO), 'shell');
      eq(routeFor('GET', SWO + '/js/stores.js', SWO), 'shell');
    });
    test('sw', 'Supabaseのデータ取得は data・写真は img', () => {
      eq(routeFor('GET', 'https://x.supabase.co/rest/v1/stores?select=*', SWO), 'data');
      eq(routeFor('GET', 'https://x.supabase.co/storage/v1/object/public/taverna-photos/a/b.jpg', SWO), 'img');
    });
    test('sw', '認証は絶対にキャッシュしない（素通し）', () => {
      eq(routeFor('GET', 'https://x.supabase.co/auth/v1/user', SWO), null);
      eq(routeFor('POST', 'https://x.supabase.co/auth/v1/token?grant_type=password', SWO), null);
    });
    test('sw', '書き込み（GET以外）は素通し', () => {
      eq(routeFor('POST', 'https://x.supabase.co/rest/v1/stores', SWO), null);
      eq(routeFor('PATCH', 'https://x.supabase.co/rest/v1/stores?id=eq.1', SWO), null);
      eq(routeFor('DELETE', 'https://x.supabase.co/rest/v1/visits?id=eq.1', SWO), null);
      eq(routeFor('POST', SWO + '/x', SWO), null);
    });
    test('sw', 'CDNは cdn・地図タイルや住所検索は素通し', () => {
      eq(routeFor('GET', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', SWO), 'cdn');
      eq(routeFor('GET', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', SWO), 'cdn');
      eq(routeFor('GET', 'https://tile.openstreetmap.org/1/2/3.png', SWO), null);
      eq(routeFor('GET', 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=a', SWO), null);
    });
    test('sw', 'supabase.co に似せた別ドメインは data 扱いしない', () => {
      eq(routeFor('GET', 'https://evilsupabase.co/rest/v1/stores', SWO), null);
      eq(routeFor('GET', 'https://x.supabase.co.evil.com/rest/v1/stores', SWO), null);
    });
    test('sw', '事前キャッシュにページ5つと pwa.js が入っている', () => {
      ['index.html', 'store-detail.html', 'store-edit.html', 'ranking.html', 'login.html', 'js/pwa.js']
        .forEach(f => assert(PRECACHE.includes(f), f + ' が PRECACHE に無い'));
    });

    // ─── 実行＆描画 ───
    window.addEventListener('load', () => {
      let pass = 0, fail = 0;
      const bySuite = {};
      for (const t of T) {
        let ok = true, err = '';
        try { t.fn(); } catch (e) { ok = false; err = e.message; }
        (bySuite[t.suite] = bySuite[t.suite] || []).push({ name: t.name, ok, err });
        ok ? pass++ : fail++;
      }

      const results = document.getElementById('results');
      results.innerHTML = Object.keys(bySuite).map(suite => `
        <div class="suite">
          <div class="suite-title">${suite}</div>
          ${bySuite[suite].map(c => `
            <div class="case ${c.ok ? 'pass' : 'fail'}">
              <span class="mark">${c.ok ? '✓' : '✗'}</span>
              <span>${c.name}${c.ok ? '' : ` — <span class="err">${c.err}</span>`}</span>
            </div>`).join('')}
        </div>`).join('');

      const summary = document.getElementById('summary');
      summary.textContent = `${pass} / ${pass + fail} 件 合格` + (fail ? `（${fail} 件 失敗）` : ' 🎉');
      summary.className = 'summary ' + (fail ? 'ng' : 'ok');
    });
  </script>
</body>
</html>
